name: app-ci
on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://claims:claims@localhost:5432/claims_hub
      # Integration tests migrate and use this DB and clean up after themselves.
      TEST_DATABASE_URL: postgresql://claims:claims@localhost:5432/claims_hub
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claims" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://claims:claims@localhost:5432/claims_hub
      E2E_DATABASE_URL: postgresql://claims:claims@localhost:5432/claims_hub_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claims" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
