# Decision routing rules for Claims Resolution & Recovery Hub
#
# PROTOTYPE ASSUMPTIONS FOR DEMONSTRATION ONLY.
# These thresholds are not legal or regulatory standards and must not be
# presented to end users as such. No language model may silently override
# the workflow rule these scores select.
#
# This is a cross-cutting overlay on top of the entity schema in schema/,
# which as of 2026-09-25 follows docs/migration/ (a live code/schema
# inspection of the deployed build), not docs/claimflow-luo-playbook.md.
# None of the 11 live entities store this five-factor breakdown directly -
# it is meant to be computed/displayed alongside them, e.g. from
# ResolutionProposal.rationale / customer_impact / business_exposure and
# the Attachment evidence_status values.

version: "0.3.0"

factors:
  - id: evidence_completeness
    label: "Evidence completeness"
    scale:
      0: "Complete"
      1: "Minor gap"
      2: "Material gap"
      3: "Insufficient"
  - id: policy_clarity
    label: "Policy clarity"
    scale:
      0: "Explicit rule"
      1: "Likely rule"
      2: "Ambiguous rule"
      3: "No rule"
  - id: customer_impact
    label: "Customer impact"
    scale:
      0: "Low"
      1: "Moderate"
      2: "Significant"
      3: "Critical"
  - id: business_exposure
    label: "Business exposure"
    scale:
      0: "Negligible"
      1: "Manageable"
      2: "Material"
      3: "High"
  - id: recovery_potential
    label: "Recovery potential"
    scale:
      0: "None"
      1: "Uncertain"
      2: "Probable"
      3: "Strong"

# Total score = sum of the five factor scores (range 0-15).
workflow_routing:
  - score_range: [0, 4]
    path: quick_review
    label: "Draft recommendation and allow quick review"
  - score_range: [5, 7]
    path: evidence_or_supervisor_check
    label: "Require evidence completion or supervisor check"
  - score_range: [8, 10]
    path: human_approval_required
    label: "Require explicit human approval"
  - score_range: [11, 15]
    path: escalate_block_auto_closure
    label: "Escalate and block automatic closure"

display_requirements:
  - "Every recommendation must show the contributing factor scores."
  - "Every recommendation must cite the policy source (document + excerpt + rule version) it relied on."
  - "Every recommendation must list missing information, if any."

# Matches CustomerCase.case_type and Rule.trigger_type in schema/customer-case.schema.json
# and schema/rule.schema.json, per docs/migration/04_data_dictionary.md.
# NOTE: "defective_product" was in an earlier version of this list (from
# docs/claimflow-luo-playbook.md) but the live inventory's case_type enum does
# NOT include it - removed.
case_types:
  - damaged_delivery
  - wrong_item
  - missing_item
  - return_request
  - other

# UNCONFIRMED. docs/migration/04_data_dictionary.md does not report an enum for
# ResolutionProposal.recommendation or Rule.recommended_resolution - both are
# free text in the live build. An earlier version of this file listed
# replacement/refund/store_credit/reject as a fixed enum (from
# docs/claimflow-luo-playbook.md); that has been removed as unconfirmed by the
# more authoritative live inspection. These are example values only, useful
# for prompt-writing and demo-data consistency, NOT a schema constraint.
example_resolution_recommendations:
  - "Replacement"
  - "Refund"
  - "Store credit"
  - "Request Missing Evidence"
  - "Reject"

# RecoveryDraft.claim_type (schema/recovery-draft.schema.json) is free text
# per docs/migration/04_data_dictionary.md, not a fixed enum. Example values
# only, for prompt-writing and demo-data consistency.
example_claim_reasons:
  - "Shipping damage - carrier claim"
  - "Item lost in transit - carrier claim"
  - "Defective product - supplier claim"
  - "Shortage / missing item - supplier claim"
